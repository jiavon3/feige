<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天 · 飞鸽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#14201c',
            paper: '#f3f6f4',
            celadon: '#2f7a6d',
            line: '#d5e0db',
            muted: '#5c6b66',
            amber: '#d97706',
            mine: '#e7f4f1'
          },
          fontFamily: {
            display: ['"Songti SC"', 'Palatino', 'serif'],
            sans: ['"PingFang SC"', '"Noto Sans SC"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans bg-paper text-ink">
  <div class="flex min-h-full">
    <aside class="w-72 bg-ink text-paper flex flex-col gap-3 p-5">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <svg width="28" height="28" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="64" height="64" rx="16" fill="#2f7a6d"/>
            <path fill="#f3f6f4" d="M10 38c9-3 15-12 17-20 2 8 7 14 15 17-8 2-14 6-17 13-1-5-6-8-15-10z"/>
            <path d="M46 18h8v6l-4 3-4-3z" fill="#d97706"/>
          </svg>
          <span class="font-display tracking-widest text-lg text-[#5aa99a]">飞鸽</span>
        </div>
        <button type="button" class="text-sm text-paper/80">退出</button>
      </div>
      <p class="text-sm text-paper/60">admin</p>
      <button type="button" class="flex items-center justify-between gap-2 rounded-xl bg-white/10 px-3 py-2.5 text-left">
        <span>大厅</span>
        <span class="rounded-full bg-amber px-2 text-xs text-white">2</span>
      </button>
      <p class="text-xs text-paper/50">其他人</p>
      <button type="button" class="flex items-center gap-2 rounded-xl px-3 py-2.5 text-left text-paper/80">
        <span class="h-2 w-2 rounded-full bg-[#5aa99a]"></span>
        <span class="flex-1">张三</span>
      </button>
      <button type="button" class="flex items-center gap-2 rounded-xl px-3 py-2.5 text-left text-paper/80">
        <span class="h-2 w-2 rounded-full bg-[#8a8175]"></span>
        <span class="flex-1">李四</span>
        <span class="rounded-full bg-amber px-2 text-xs text-white">1</span>
      </button>
    </aside>
    <main class="flex-1 flex flex-col min-w-0">
      <header class="border-b border-line bg-white px-6 py-4 flex flex-col gap-1">
        <h1 class="font-display text-2xl">大厅</h1>
        <p class="text-xs text-muted">信笺主题 · 消息区滚动 · 输入固定底部</p>
      </header>
      <div class="flex-1 overflow-auto p-6 flex flex-col gap-4 bg-paper">
        <button type="button" class="w-full rounded-xl border border-dashed border-line px-3 py-2 text-sm text-muted">查看历史</button>
        <article class="max-w-md self-end rounded-xl border border-line bg-mine px-3 py-2">
          <div class="text-xs text-muted">admin · 刚刚</div>
          <div>局域网里见。</div>
          <div class="flex gap-3 pt-2 text-xs text-celadon">
            <span>引用</span><span>撤回</span>
          </div>
        </article>
        <article class="max-w-md rounded-xl border border-line bg-white px-3 py-2">
          <div class="text-xs text-muted">张三 · 刚刚</div>
          <div class="border-l-4 border-celadon bg-celadon/5 px-2 py-1 text-xs text-muted">admin：局域网里见。</div>
          <div>收到，晚点传图。</div>
          <div class="flex gap-3 pt-2 text-xs text-celadon"><span>引用</span></div>
        </article>
      </div>
      <div class="border-t border-line bg-white px-4 py-3 flex items-center gap-2">
        <div class="flex-1 rounded-xl border border-line px-3 py-2 text-sm text-muted">写一条消息</div>
        <button type="button" class="rounded-xl border border-line px-3 py-2 text-sm">选择图片</button>
        <button type="button" class="rounded-xl border border-line px-3 py-2 text-sm">选择文件</button>
        <button type="button" class="rounded-xl bg-celadon text-paper px-4 py-2 text-sm">发送</button>
      </div>
    </main>
  </div>
  <script id="interaction-data" type="application/json">
  `[]`
  </script>
</body>
</html>
