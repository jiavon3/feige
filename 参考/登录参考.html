<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>账号登录 · 橘猫互动版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(120deg, #f7faff, #edf4ff);
            gap: 80px;
            padding: 40px;
        }

        /* 左侧橘猫区域 */
        .cat-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tip-bubble {
            position: absolute;
            top: -50px;
            left: 40px;
            background: #ffffff;
            padding: 10px 18px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            font-size: 14px;
            color: #333;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .tip-bubble::after {
            content: "";
            position: absolute;
            left: 30px;
            bottom: -8px;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #ffffff;
        }

        .cat-scene {
            position: relative;
            width: 360px;
            height: 420px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .cat-shadow {
            position: absolute;
            bottom: 10px;
            width: 260px;
            height: 30px;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.18), transparent 70%);
            z-index: 0;
            transition: transform 0.4s ease;
        }

        .cat {
            position: relative;
            width: 340px;
            z-index: 1;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-origin: bottom center;
        }

        .cat:hover {
            transform: translateY(-6px) rotate(-1deg);
        }

        /* 眼睛容器 */
        .cat-eyes {
            position: absolute;
            top: 98px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 42px;
            z-index: 3;
            pointer-events: none;
        }

        .eye {
            position: absolute;
            width: 34px;
            height: 42px;
            background: #fff;
            border-radius: 50%;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .eye.left {
            left: 8px;
        }

        .eye.right {
            right: 8px;
        }

        .pupil {
            position: absolute;
            width: 16px;
            height: 22px;
            background: #222;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* 眨眼动画 */
        @keyframes blink {
            0%, 100% {
                transform: scaleY(1);
            }
            50% {
                transform: scaleY(0.1);
            }
        }

        .eye.blinking {
            animation: blink 0.25s ease-in-out;
        }

        /* 前爪 */
        .paw {
            position: absolute;
            bottom: 50px;
            width: 40px;
            height: 28px;
            background: #f2a950;
            border-radius: 50%;
            z-index: 2;
            transition: transform 0.4s ease;
        }

        .paw.left {
            left: 90px;
        }

        .paw.right {
            right: 90px;
        }

        .cat.paw-action .paw.left {
            transform: translateX(-6px) translateY(-4px);
        }

        .cat.paw-action .paw.right {
            transform: translateX(6px) translateY(-4px);
        }

        /* 登录卡片 */
        .login-card {
            background: #ffffff;
            width: 460px;
            padding: 44px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .login-card:hover {
            box-shadow: 0 14px 48px rgba(39, 110, 241, 0.12);
            transform: translateY(-4px);
        }

        .login-card h1 {
            font-size: 28px;
            color: #1d2129;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 14px;
            color: #86909c;
            margin-bottom: 32px;
        }

        .form-item {
            margin-bottom: 26px;
        }

        .form-item label {
            display: block;
            font-size: 14px;
            color: #1d2129;
            margin-bottom: 10px;
        }

        .form-item input {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid #e5e6eb;
            padding: 12px 0;
            font-size: 16px;
            outline: none;
            background: transparent;
            transition: border-color 0.3s ease;
        }

        .form-item input:focus {
            border-bottom-color: #276ef1;
        }

        .pwd-row {
            position: relative;
        }

        .eye-icon {
            position: absolute;
            right: 6px;
            bottom: 14px;
            font-size: 18px;
            color: #86909c;
            cursor: pointer;
            user-select: none;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #4080ff, #276ef1);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(39, 110, 241, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .tip-text {
            text-align: center;
            font-size: 12px;
            color: #86909c;
            margin-top: 24px;
        }

        /* 响应式 */
        @media (max-width: 960px) {
            body {
                flex-direction: column;
                gap: 40px;
                padding: 20px;
            }

            .cat-scene {
                height: 320px;
            }

            .cat {
                width: 260px;
            }

            .cat-eyes {
                top: 74px;
                width: 86px;
            }

            .eye {
                width: 26px;
                height: 32px;
            }

            .pupil {
                width: 12px;
                height: 16px;
            }

            .paw {
                bottom: 38px;
                width: 30px;
                height: 22px;
            }

            .paw.left {
                left: 68px;
            }

            .paw.right {
                right: 68px;
            }

            .login-card {
                width: 100%;
                padding: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="cat-wrap">
        <div class="tip-bubble">喵，欢迎回来</div>

        <div class="cat-scene">
            <div class="cat-shadow"></div>

            <div class="cat" id="cat">
                <!-- 橘猫 SVG -->
                <svg viewBox="0 0 340 420" xmlns="http://www.w3.org/2000/svg">
                    <!-- 身体 -->
                    <ellipse cx="170" cy="300" rx="110" ry="90" fill="#f2a950"/>
                    <ellipse cx="170" cy="310" rx="78" ry="60" fill="#ffd9a8"/>

                    <!-- 尾巴 -->
                    <path d="M270 280 Q320 240 310 190 Q300 160 280 170"
                          stroke="#f2a950" stroke-width="22" fill="none" stroke-linecap="round"/>

                    <!-- 后腿 -->
                    <ellipse cx="110" cy="380" rx="32" ry="22" fill="#f2a950"/>
                    <ellipse cx="230" cy="380" rx="32" ry="22" fill="#f2a950"/>

                    <!-- 头部 -->
                    <circle cx="170" cy="140" r="90" fill="#f2a950"/>

                    <!-- 脸部白色区域 -->
                    <ellipse cx="170" cy="160" rx="58" ry="46" fill="#ffd9a8"/>

                    <!-- 耳朵 -->
                    <polygon points="95,80 115,140 70,130" fill="#f2a950"/>
                    <polygon points="245,80 225,140 270,130" fill="#f2a950"/>
                    <polygon points="98,90 112,132 78,124" fill="#ffd9a8"/>
                    <polygon points="242,90 228,132 262,124" fill="#ffd9a8"/>

                    <!-- 条纹 -->
                    <path d="M100 110 Q110 100 118 112" stroke="#d67a24" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M240 110 Q230 100 222 112" stroke="#d67a24" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M130 70 Q140 60 148 72" stroke="#d67a24" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M210 70 Q200 60 192 72" stroke="#d67a24" stroke-width="4" fill="none" stroke-linecap="round"/>

                    <!-- 嘴部 -->
                    <path d="M155 175 Q170 188 185 175" stroke="#c94a2b" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M170 178 L170 192" stroke="#c94a2b" stroke-width="3" stroke-linecap="round"/>
                    <path d="M140 168 Q130 166 122 172" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <path d="M200 168 Q210 166 218 172" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>

                    <!-- 前爪 -->
                    <ellipse class="paw left" cx="110" cy="350" rx="22" ry="16" fill="#f2a950"/>
                    <ellipse class="paw right" cx="230" cy="350" rx="22" ry="16" fill="#f2a950"/>
                </svg>

                <!-- 眼睛层 -->
                <div class="cat-eyes">
                    <div class="eye left">
                        <div class="pupil" id="pupilLeft"></div>
                    </div>
                    <div class="eye right">
                        <div class="pupil" id="pupilRight"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="login-card" id="loginCard">
        <h1>账号登录</h1>
        <p class="desc">欢迎回来，请使用工作账号登录系统</p>

        <div class="form-item">
            <label>账号</label>
            <input type="text" id="accountInput" placeholder="请输入账号">
        </div>

        <div class="form-item">
            <label>密码</label>
            <div class="pwd-row">
                <input type="password" id="passwordInput" placeholder="请输入密码">
                <span class="eye-icon" id="togglePwd">👁</span>
            </div>
        </div>

        <button class="login-btn" id="loginBtn">登录</button>

        <p class="tip-text">如需开通账号或重置密码，请联系系统管理员</p>
    </div>

    <script>
        const cat = document.getElementById('cat');
        const loginCard = document.getElementById('loginCard');
        const accountInput = document.getElementById('accountInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const togglePwd = document.getElementById('togglePwd');
        const pupilLeft = document.getElementById('pupilLeft');
        const pupilRight = document.getElementById('pupilRight');

        // 眼睛目标位置
        const eyeTargets = {
            default: { x: 0, y: 0 },
            account: { x: -8, y: 4 },
            password: { x: 8, y: 4 },
            button: { x: 0, y: 10 }
        };

        function moveEyes(target) {
            const { x, y } = eyeTargets[target] || eyeTargets.default;
            pupilLeft.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            pupilRight.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        }

        function blink() {
            const eyes = document.querySelectorAll('.eye');
            eyes.forEach(eye => {
                eye.classList.add('blinking');
                setTimeout(() => eye.classList.remove('blinking'), 250);
            });
        }

        // 鼠标悬停登录卡片，橘猫看向卡片
        loginCard.addEventListener('mouseenter', () => {
            cat.style.transform = 'translateX(14px)';
        });

        loginCard.addEventListener('mouseleave', () => {
            cat.style.transform = '';
            moveEyes('default');
        });

        // 账号输入框聚焦
        accountInput.addEventListener('focus', () => {
            moveEyes('account');
            cat.style.transform = 'translateX(-10px) rotate(-2deg)';
            blink();
        });

        accountInput.addEventListener('blur', () => {
            cat.style.transform = '';
            moveEyes('default');
        });

        // 密码输入框聚焦
        passwordInput.addEventListener('focus', () => {
            moveEyes('password');
            cat.style.transform = 'translateX(10px) rotate(2deg)';
            blink();
        });

        passwordInput.addEventListener('blur', () => {
            cat.style.transform = '';
            moveEyes('default');
        });

        // 登录按钮悬停
        loginBtn.addEventListener('mouseenter', () => {
            moveEyes('button');
            cat.classList.add('paw-action');
            cat.style.transform = 'translateY(-4px)';
        });

        loginBtn.addEventListener('mouseleave', () => {
            cat.classList.remove('paw-action');
            cat.style.transform = '';
            moveEyes('default');
        });

        // 点击登录按钮
        loginBtn.addEventListener('click', () => {
            cat.classList.add('paw-action');
            blink();
            cat.style.transform = 'translateY(-8px) scale(1.03)';

            setTimeout(() => {
                cat.classList.remove('paw-action');
                cat.style.transform = '';
            }, 600);
        });

        // 密码显隐切换
        togglePwd.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePwd.textContent = type === 'password' ? '👁' : '🙈';
        });
    </script>

</body>
</html>
