<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>飞鸽</title>
    <link rel="icon" href="/favicon.png?v=2" type="image/png">
    <script>
        (function () {
            var match = document.cookie.match(/(?:^|; )feige-theme=([^;]*)/);
            var theme = match ? decodeURIComponent(match[1]) : "classic";
            if (theme !== "classic" && theme !== "signal") theme = "classic";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
    <aside>
        <div class="brand">
            <a class="brand-lockup" href="/chat">
                <img class="brand-mark" src="/favicon.png?v=2" alt="">
                <span class="mark">飞鸽</span>
            </a>
        </div>
        <button id="hall" class="nav active" type="button">
            <span>大厅</span>
            <span id="hallBadge" class="badge" hidden></span>
        </button>
        <p class="nav-label">联系人</p>
        <div id="users" class="people"></div>

        <div class="user-bar">
            <div class="me-wrap">
                <button id="meAvatar" class="me-avatar" type="button" aria-label="更换头像">
                    <img id="meAvatarImg" src="/favicon.png?v=2" alt="">
                </button>
                <button id="meName" class="me-name" type="button" aria-label="打开菜单"></button>

                <div id="avatarPicker" class="avatar-picker" hidden role="dialog" aria-label="选择头像">
                    <div class="avatar-grid" id="avatarGrid"></div>
                    <label class="avatar-upload">
                        <input id="avatarUpload" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
                        <span>上传自定义头像</span>
                    </label>
                </div>

                <div id="nameMenu" class="name-menu" hidden role="menu">
                    <button type="button" data-action="settings">设置</button>
                    <button type="button" data-action="password">修改密码</button>
                    <button id="adminMenuBtn" type="button" data-action="admin" hidden>管理设置</button>
                </div>
            </div>
            <form method="post" action="/logout">
                <input type="hidden" name="_csrf">
                <button class="text" type="submit">退出</button>
            </form>
        </div>
    </aside>
    <main>
        <header class="thread-head">
            <h1 id="title">大厅</h1>
            <p id="status" class="status" hidden>连接已断开，正在重连</p>
            <p id="flash" class="flash" hidden></p>
        </header>
        <div id="log" class="log"></div>
        <div id="quoteBar" class="quote-bar" hidden>
            <div>
                <strong id="quoteWho"></strong>
                <span id="quoteText"></span>
            </div>
            <button id="quoteCancel" class="text ink" type="button">取消</button>
        </div>
        <form id="composer" class="composer">
            <div class="composer-shell">
                <div class="composer-toolbar">
                    <div class="tool-group">
                        <div class="emoji-wrap">
                            <button id="emojiToggle" class="tool-btn" type="button" title="表情" aria-label="表情" aria-expanded="false">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10" r="1.2" fill="currentColor"/><circle cx="15" cy="10" r="1.2" fill="currentColor"/><path d="M8.5 14.2c1.2 1.4 2.4 2 3.5 2s2.3-.6 3.5-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                            </button>
                            <div id="emojiPanel" class="emoji-panel" hidden role="dialog" aria-label="表情"></div>
                        </div>
                        <label class="tool-btn" title="图片" aria-label="图片">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10.5" r="1.5" fill="currentColor"/><path d="M7 16.5l3.2-3.2 2.3 2.3 3-3.6 3.5 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <input id="image" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
                        </label>
                        <label class="tool-btn" title="文件" aria-label="文件">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5H8A2.5 2.5 0 0 0 5.5 7v10A2.5 2.5 0 0 0 8 19.5h8A2.5 2.5 0 0 0 18.5 17V9.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14.5 4.5V9.5H18.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
                            <input id="file" type="file" multiple>
                        </label>
                        <div class="font-wrap">
                            <button id="fontToggle" class="tool-btn" type="button" title="字体" aria-label="字体" aria-expanded="false">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18.5L10.2 5.5h3.6L19 18.5h-3.1l-1-2.8H9.1l-1 2.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.8 12.8h4.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                            </button>
                            <div id="fontPanel" class="font-panel" hidden role="dialog" aria-label="字体设置">
                                <div class="font-row">
                                    <span class="font-label">字号</span>
                                    <div class="font-chips" id="fontSizeChips"></div>
                                </div>
                                <div class="font-row">
                                    <span class="font-label">样式</span>
                                    <div class="font-chips" id="fontStyleChips"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <span class="composer-hint">粘贴图片 · Enter 发送</span>
                </div>
                <div id="attachPreview" class="attach-preview" hidden>
                    <div id="attachThumbs" class="attach-thumbs"></div>
                    <div class="attach-meta">
                        <span id="fileName" class="file-name"></span>
                    </div>
                </div>
                <div class="composer-main">
                    <textarea id="text" maxlength="2000" rows="3" placeholder="写一条消息…"></textarea>
                    <button class="send-btn" type="submit">发送</button>
                </div>
            </div>
        </form>
    </main>
</div>
<div id="settingsModal" class="modal" hidden>
    <div class="modal-card">
        <div class="modal-head">
            <h2>账号设置</h2>
            <button id="settingsClose" class="text" type="button">关闭</button>
        </div>
        <div class="modal-body">
            <label class="field">
                <span class="field-label">账号</span>
                <input id="settingsUsername" type="text" readonly>
            </label>
            <label class="field">
                <span class="field-label">昵称</span>
                <input id="settingsNickname" type="text" maxlength="30" placeholder="未设置则显示用户名">
            </label>
            <p id="settingsError" class="error" hidden></p>
        </div>
        <div class="modal-foot">
            <button id="settingsCancel" class="text" type="button">取消</button>
            <button id="settingsSave" class="send-btn" type="button">保存</button>
        </div>
    </div>
</div>

<div id="passwordModal" class="modal" hidden>
    <div class="modal-card">
        <div class="modal-head">
            <h2>修改密码</h2>
            <button id="passwordClose" class="text" type="button">关闭</button>
        </div>
        <div class="modal-body">
            <label class="field">
                <span class="field-label">当前密码</span>
                <input id="passwordCurrent" type="password" autocomplete="current-password">
            </label>
            <label class="field">
                <span class="field-label">新密码</span>
                <input id="passwordNew" type="password" autocomplete="new-password">
            </label>
            <label class="field">
                <span class="field-label">确认新密码</span>
                <input id="passwordConfirm" type="password" autocomplete="new-password">
            </label>
            <p id="passwordError" class="error" hidden></p>
        </div>
        <div class="modal-foot">
            <button id="passwordCancel" class="text" type="button">取消</button>
            <button id="passwordSave" class="send-btn" type="button">保存</button>
        </div>
    </div>
</div>
<div id="adminModal" class="modal" hidden>
    <div class="modal-card wide">
        <div class="modal-head">
            <div class="modal-title">
                <h2>管理设置</h2>
                <p class="modal-sub">仅管理员可见，修改会立即同步给所有在线用户</p>
            </div>
            <button id="adminClose" class="text" type="button">关闭</button>
        </div>
        <div class="modal-body admin-body">
            <section class="themes admin-section">
                <div class="section-head">
                    <h3>界面主题</h3>
                    <span class="section-hint">所有人同步生效</span>
                </div>
                <div class="theme-switch">
                    <button class="choice" type="button" data-theme-choice="classic">
                        <span class="theme-preview preview-classic" aria-hidden="true"></span>
                        <span class="theme-copy"><strong>信笺</strong><small>浅色信纸</small></span>
                    </button>
                    <button class="choice" type="button" data-theme-choice="signal">
                        <span class="theme-preview preview-signal" aria-hidden="true"></span>
                        <span class="theme-copy"><strong>信标</strong><small>深色终端</small></span>
                    </button>
                </div>
            </section>
            <section class="records admin-section">
                <div class="section-head">
                    <h3>账号和记录</h3>
                    <button id="adminClear" class="danger" type="button">清空全部聊天记录和文件</button>
                </div>
                <p class="lede">删除用户会带走他的消息、文件，以及他参与的私聊。清空只删记录和文件，账号都还在。</p>
                <p id="adminFlash" class="flash" hidden></p>
                <div class="records-table">
                    <table>
                        <thead>
                        <tr><th>用户名</th><th>注册时间</th><th></th></tr>
                        </thead>
                        <tbody id="adminRows"></tbody>
                    </table>
                </div>
                <p id="adminEmpty" class="lede empty-state" hidden>还没有普通用户。</p>
            </section>
        </div>
    </div>
</div>
<script src="/js/csrf.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
