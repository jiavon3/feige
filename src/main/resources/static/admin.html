<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理 · 飞鸽</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <script>
        (function () {
            var match = document.cookie.match(/(?:^|; )feige-theme=([^;]*)/);
            var theme = match ? decodeURIComponent(match[1]) : "classic";
            if (theme !== "classic" && theme !== "signal") theme = "classic";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="admin">
    <header class="admin-bar">
        <a class="brand-lockup" href="/chat"><img class="brand-mark" src="/favicon.png" alt=""><span class="mark">飞鸽</span></a>
        <a href="/chat">返回聊天</a>
    </header>
    <main>
        <h1>账号和记录</h1>
        <p class="lede">删除用户会带走他的消息、文件，以及他参与的私聊。清空只删记录和文件，账号都还在。</p>
        <section class="themes">
            <h2>界面主题</h2>
            <p class="lede">切换后，正在使用这个服务的人都会换成同一套界面。</p>
            <div class="theme-switch">
                <button class="choice" type="button" data-theme-choice="classic">信笺</button>
                <button class="choice" type="button" data-theme-choice="signal">信标</button>
            </div>
        </section>
        <p id="flash" class="flash" hidden></p>
        <button id="clear" class="danger" type="button">清空全部聊天记录和文件</button>
        <table>
            <thead>
            <tr><th>用户名</th><th>注册时间</th><th></th></tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
        <p id="empty" hidden>还没有普通用户。</p>
    </main>
</div>
<script src="/js/csrf.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
