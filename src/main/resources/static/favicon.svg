<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Feige">
  <defs>
    <linearGradient id="bg" x1="10" y1="2" x2="54" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f7a6d"/>
      <stop offset="1" stop-color="#1f5c52"/>
    </linearGradient>
    <linearGradient id="sheen" x1="14" y1="6" x2="44" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="env" x1="30" y1="40" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4f0ed"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#0f3d36" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <!-- motion arc -->
  <path d="M14 20c10-8 22-10 34-5" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/>
  <!-- back wing -->
  <path fill="#b8d4cc" fill-opacity="0.85" d="M18 30c0-10 7-16 14-17-2 7-4 13-8 18-3 1-6 1-6-1z"/>
  <!-- body -->
  <ellipse cx="34" cy="34" rx="13" ry="9" fill="#ffffff" transform="rotate(-18 34 34)"/>
  <!-- front wing -->
  <path fill="#ffffff" d="M16 34c8-7 17-8 26-3-4 4-11 6-18 6-5 0-8-1-8-3z"/>
  <path d="M21 33v5.5M25.5 32.2v6M30 32v5.8M34.5 32.4v5" fill="none" stroke="#8fb8ad" stroke-width="1.25" stroke-linecap="round"/>
  <!-- tail -->
  <path fill="#eef6f3" d="M20 36c-5 2-8 6-9 10 4-2 8-3 11-4 0-2 0-4-2-6z"/>
  <!-- head -->
  <circle cx="47" cy="26.5" r="5.8" fill="#ffffff"/>
  <circle cx="48.8" cy="25.6" r="1.4" fill="#1a3d36"/>
  <!-- beak -->
  <path fill="#e8a84a" d="M52.2 27.2l6.4 1.3-6.2 2.3z"/>
  <path d="M53 30.2c1 3.4 1.2 6.4-0.3 9.2" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- envelope -->
  <g filter="url(#soft)">
    <rect x="31" y="40" width="20" height="14.5" rx="1.8" fill="url(#env)"/>
    <path d="M32.3 41.5L41 48l8.7-6.5" fill="none" stroke="#6fa898" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45.5 37.8h5.4v6.8l-2.7-1.8-2.7 1.8z" fill="#c94a42"/>
  </g>
</svg>
