server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    session:
      # 空闲一天后才过期；不设 cookie max-age，关浏览器即清会话
      timeout: 24h
      cookie:
        http-only: true
        same-site: lax
        name: FEIGESESSION

spring:
  datasource:
    url: jdbc:h2:file:${feige.data-dir}/feige;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

logging:
  level:
    root: INFO
    feige: INFO
